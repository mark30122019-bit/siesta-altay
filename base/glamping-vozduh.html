\":{\"min\":null,\"max\":null,\"units_count\":3},\"amenities\":{\"banya\":null,\"pool\":false,\"wifi\":true,\"kitchen\":null,\"heating\":null,\"parking\":null,\"waterfront\":false,\"food\":false,\"pets\":null,\"year_round\":null},\"suitability\":{\"family_kids\":{\"fit\":null,\"note\":\"Купола можно взять по одному, но места вокруг — частный сектор, без выхода к реке. Атмосфера тихая, рассчитанная скорее на взрослых.\"},\"couples\":{\"fit\":true,\"note\":\"Три купола, каждый в своём стиле, виды на горы по периметру, тишина.\"},\"company\":{\"fit\":true,\"note\":\"База выкупается целиком — три купола и общий купол для сбора.\"},\"corporate\":{\"fit\":true,\"note\":\"Выкуп целиком под тренинг, ретрит или небольшое мероприятие. Общий купол для собраний, Wi-Fi.\"}},\"author\":{\"verdict\":\"Мы снимали «Воздух» дважды — днём и ночью, потому что с вечерней подсветкой он выглядит совершенно иначе, и по одним дневным кадрам этого не понять. Стоит в глубине посёлка Усть-Сема, горы видно по всему периметру, и на рассвете и на закате отсюда очень хорошие виды. Размещение в трёх куполах: можно взять один, можно выкупить базу целиком и провести мероприятие, тренинг или свадьбу. Купола одинаковые по площади, но у каждого свой стиль. Есть общий купол — для собраний или для еды. Wi-Fi на территории. Атмосфера здесь спокойная, проходит много ретритов, и место одинаково годится и под мероприятие, и просто под отдых. Собственник всегда на связи и решает вопросы оперативно.\",\"good_for\":[\"ретритам, тренингам и небольшим мероприятиям с выкупом базы целиком\",\"парам — виды на горы, тишина, три разных по стилю купола\",\"тем, кто хочет необычное жильё, а не стандартный номер\"],\"not_for\":[\"тех, кто едет к воде: выхода к реке нет\",\"тех, кому нужна большая своя территория — вокруг частный сектор\",\"тех, кто рассчитывает на питание в стоимости: по умолчанию оно не входит\"],\"honest_note\":\"Выхода к реке отсюда нет, и территория граничит с частным сектором. Если едете купаться в Катуни и жить у воды — это не сюда. Если едете за тишиной, горами и рассветом — сюда.\"},\"booking\":{\"min_nights\":null,\"min_nights_high_season\":null,\"prepayment\":null},\"seo\":{\"title\":\"Купольный глэмпинг «ВОЗДУХ», Усть-Сема — 3D-тур днём и ночью\",\"description\":\"Три купола в глубине Усть-Семы, горы по периметру, тихое место под ретриты. 56 сцен с эффектом день/ночь.\",\"og_image\":null},\"status\":\"ready_for_review\",\"updated_at\":\"2026-09-10\",\"events\":{\"suitable\":null,\"buyout\":{\"available\":true,\"min_guests\":null,\"min_nights\":null,\"note\":\"\"},\"sleeping\":{\"beds_total\":null,\"beds_single_occupancy\":null,\"note\":\"Три купола. Число мест уточнить.\"},\"venues\":[{\"name\":\"Общий купол\",\"type\":\"dome\",\"indoor\":true,\"area_m2\":null,\"capacity\":{\"theatre\":null,\"banquet\":null,\"buffet\":null,\"classroom\":null},\"heated\":null,\"note\":\"Для собраний и приёма пищи.\"}],\"catering\":{\"own_kitchen\":false,\"banquet_menu\":null,\"external_catering_allowed\":null,\"note\":\"Питание оговаривается отдельно, по умолчанию не входит.\"},\"equipment\":{\"projector\":null,\"screen\":null,\"sound\":null,\"microphones\":null,\"stage\":null,\"outdoor_power\":null,\"wifi_for_conference\":null,\"note\":\"\"},\"logistics\":{\"bus_access\":null,\"bus_turnaround\":null,\"parking_cars\":null,\"road_quality\":null,\"from_novosibirsk_hours\":null,\"note\":\"\"},\"season\":{\"year_round\":null,\"winter_events\":null,\"heated_venues\":null},\"wedding\":{\"ceremony_spot\":null,\"ceremony_rain_plan\":null,\"bride_room\":null,\"noise_curfew\":null,\"external_vendors_allowed\":null,\"photo_spots\":\"Горы по периметру, рассвет и закат. Вечерняя подсветка куполов.\",\"exclusive_date\":null},\"legal\":{\"works_with_legal_entity\":null,\"cashless\":null,\"vat\":null,\"closing_documents\":null},\"activities\":[],\"contact_manager\":null}},\"defaultMode\":\"leisure\"}]}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"
