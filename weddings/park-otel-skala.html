вали здесь. База стоит недалеко от трассы, съезд сразу, но жилые модули уведены в глубину, ближе к Катуни. Вдоль базы искусственное озеро, за ним лесополоса и река. Вокруг озера проложены бетонные дорожки для бега — управляющая базой сама бегает и делала их в том числе под себя. Бежать можно даже днём: фактически бежишь по лесу, не жарко. Дома из массивного дерева, брёвна сантиметров по сорок в диаметре, изнутри отшлифованы — выглядит это очень красиво. Здания до трёх этажей, и один юнит занимает часть этажа. Недавно построили бассейн, батут для детей был всегда. Завтрак входит в проживание, шведский стол сытный; в кафе есть локальная кухня — марал, пельмени из марала, свои авторские напитки. Баня на дровах сдаётся отдельно. Отдельно стоит здание у трассы: на втором этаже конференц-зал около тысячи квадратных метров, один из самых больших в регионе, а на первом «Магнит» — продукты и детское питание покупаются не выходя с базы, при этом магазин отделён, и покупатели на территорию не заходят.4:[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"LodgingBusiness\\\",\\\"name\\\":\\\"Парк-отель SKALA\\\",\\\"description\\\":\\\"Большая территория с озером и беговыми дорожками, бассейн, завтраки в стоимости, зал на 1000 м². 108 сцен, включая аэропанорамы.\\\",\\\"url\\\":\\\"https://mark30122019-bit.github.io/siesta-altay/base/park-otel-skala\\\",\\\"image\\\":\\\"https://mark30122019-bit.github.io/siesta-altay/media/park-otel-skala/tour-preview.webp\\\",\\\"address\\\":{\\\"@type\\\":\\\"PostalAddress\\\",\\\"addressLocality\\\":\\\"Барангол\\\",\\\"addressRegion\\\":\\\"Республика Алтай\\\",\\\"addressCountry\\\":\\\"RU\\\"},\\\"geo\\\":{\\\"@type\\\":\\\"GeoCoordinates\\\",\\\"latitude\\\":51.6729,\\\"longitude\\\":85.7764}}\"}}],[\"$\",\"$6\",null,{\"fallback\":[\"$\",\"div\",null,{\"className\":\"min-h-screen bg-[#F4F0E8]\",\"aria-hidden\":true}],\"children\
